<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; style-src 'self' 'unsafe-inline'">
  <title>Notes</title>
  <link rel="stylesheet" href="notes.css">
  <link rel="stylesheet" href="../overlay.css">
</head>
<body>
  <div id="panel">
    <header>
      <div class="title">Notes</div>
      <input class="op-slider" id="op-slider" type="range" min="0.1" max="1" step="0.02" title="Transparence">
      <button class="icon" id="btn-new" title="Nouvelle note">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon" id="btn-close" title="Fermer">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <div class="sidebar" id="sidebar"></div>

    <div class="toolbar">
      <button id="btn-bold" title="Gras"><b>G</b></button>
      <button id="btn-italic" title="Italique"><i>I</i></button>
      <button id="btn-list" title="Liste">•</button>
      <div class="sep"></div>
      <span id="save-status"></span>
    </div>

    <div class="editor-area" id="editor-area">
      <div class="empty-state" id="empty-state">
        <div>
          <p>Aucune note</p>
          <small>Clique + pour en creer une</small>
        </div>
      </div>
      <input type="text" id="note-title" placeholder="Titre" style="display:none">
      <textarea id="note-body" placeholder="Ecris ta note ici..." style="display:none"></textarea>
    </div>
  </div>
  <script src="../bridge.js"></script>
  <script src="notes.js"></script>
</body>
</html>

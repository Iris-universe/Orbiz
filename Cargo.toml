[package]
name = "orbiz"
version = "2.0.0"
description = "Orbiz : orbe flottant pour Windows (raccourcis, chat IA qui pilote le navigateur et les apps, notes, mini navigateur)"
edition = "2021"
license = "MIT"
default-run = "orbiz"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# briques partagées (github.com/Iris-universe/iris-briques)
iris-store = { git = "https://github.com/Iris-universe/iris-briques" }
iris-link = { git = "https://github.com/Iris-universe/iris-briques" }
iris-secrets = { git = "https://github.com/Iris-universe/iris-briques" }

tauri = { version = "2", features = ["custom-protocol", "devtools", "tray-icon", "unstable", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
dirs = "5"
chrono = "0.4"
url = "2"
regex = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
